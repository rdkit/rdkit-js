  rel="icon"
  type="image/x-icon"
  href="{{ '/favicon.ico' | relative_url }}"
/>

{% if page.layout == 'playground' %}

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<link
  rel="stylesheet"
  href="{{ '/assets/css/rdkit-playground.css' | relative_url }}"
/>

{% endif %}
<script
  type="text/javascript"
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.3/MathJax.js?config=TeX-AMS-MML_HTMLorMML"
></script>
<script src="https://unpkg.com/mermaid/dist/mermaid.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  pre.highlight {
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    opacity: 0;
    transition: opacity 0.2s;
    background: none;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }
  pre.highlight:hover .copy-btn {
    opacity: 1;
  }
  .copy-btn svg {
    width: 14px;
    height: 14px;
    display: block;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("pre.highlight").forEach(function (pre) {
      var btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.title = "Copy";
      btn.appendChild(lucide.createElement(lucide.Copy));
      btn.addEventListener("click", function () {
        var code = pre.querySelector("code");
        navigator.clipboard
          .writeText(code ? code.innerText : pre.innerText)
          .then(function () {
            btn.innerHTML = "";
            btn.appendChild(lucide.createElement(lucide.Check));
            setTimeout(function () {
              btn.innerHTML = "";
              btn.appendChild(lucide.createElement(lucide.Copy));
            }, 1500);
          });
      });
      pre.appendChild(btn);
    });
  });

  window.addEventListener("load", function () {
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      themeVariables: {
        primaryColor: "transparent",
        primaryTextColor: "#000000",
        primaryBorderColor: "#000000",
        secondaryColor: "transparent",
        secondaryTextColor: "#000000",
        secondaryBorderColor: "#000000",
        tertiaryColor: "transparent",
        tertiaryTextColor: "#000000",
        tertiaryBorderColor: "#000000",
        lineColor: "#000000",
        textColor: "#000000",
        background: "#ffffff",
        noteBkgColor: "#f5f5f5",
        noteTextColor: "#000000",
        noteBorderColor: "#000000",
        clusterBkg: "transparent",
        clusterBorder: "#000000",
        defaultLinkColor: "#000000",
        titleColor: "#000000",
        edgeLabelBackground: "#ffffff",
        edgeLabelTextColor: "#000000",
        edgeLabelBorderColor: "#000000",
        fontFamily:
          '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        fontSize: "13px",
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: "basis",
      },
    });
    window.mermaid.init(
      undefined,
      document.querySelectorAll(".language-mermaid"),
    );
  });
</script>
